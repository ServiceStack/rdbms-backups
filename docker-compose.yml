version: '3.8'

services:
  # PostgreSQL example database
  postgres:
    image: postgres:16-alpine
    container_name: example-postgres
    environment:
      POSTGRES_DB: mydb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - backup-network

  # MySQL example database
  mysql:
    image: mysql:8.0
    container_name: example-mysql
    environment:
      MYSQL_DATABASE: mydb
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backup-network
    command: --default-authentication-plugin=mysql_native_password

  # Backup service
  backup:
    build: .
    container_name: rdbms-backup
    ports:
      - "3000:3000"
    volumes:
      - ./config.json:/app/config.json
      - ./backups:/backups
      - ./backups.db:/app/backups.db
    networks:
      - backup-network
    depends_on:
      - postgres
      # - mysql  # Uncomment if using MySQL
    restart: unless-stopped
    environment:
      - NODE_ENV=production

networks:
  backup-network:
    driver: bridge

volumes:
  postgres-data:
  mysql-data:
